<svg width="1200" height="545" viewBox="0 0 1200 545" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">From data to deploy</title>
  <desc id="desc">A moving contact sheet of real project results, showing Ayush's path from data to deployment.</desc>
  <defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="9" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
  </filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#662549"/><stop offset="1" stop-color="#AE445A"/></linearGradient></defs>
  <style>
    .card { animation: float 5s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    .c1 { animation-delay:-1.1s }.c2 { animation-delay:-2.2s }.c3 { animation-delay:-3.3s }
    .track { animation: track 5s linear infinite; }
    @keyframes float { 50% { translate:0 -10px; rotate:1.2deg; } }
    @keyframes track { to { stroke-dashoffset:-80; } }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
  <rect width="1200" height="545" fill="url(#sky)"/>
  <circle cx="112" cy="85" r="50" fill="none" stroke="#F99417" stroke-width="10" stroke-dasharray="60 18"/>
  <circle cx="1090" cy="86" r="50" fill="none" stroke="#F5F5F5" stroke-width="10" stroke-dasharray="60 18"/>
  <text x="600" y="78" text-anchor="middle" fill="#F5F5F5" stroke="#451952" stroke-width="3" paint-order="stroke" font-family="Impact, Haettenschweiler, sans-serif" font-size="58" letter-spacing="3">FROM DATA TO DEPLOY</text>
  <text x="600" y="116" text-anchor="middle" fill="#F5F5F5" font-family="Georgia, serif" font-size="17" font-weight="700" font-style="italic" opacity=".9">real datasets · measured results · built to ship</text>
  <path class="track" d="M60 151H1140" stroke="#F99417" stroke-width="4" stroke-dasharray="10 10"/><circle cx="172" cy="151" r="11" fill="#451952" stroke="#F99417" stroke-width="4"/><circle cx="459" cy="151" r="11" fill="#451952" stroke="#F99417" stroke-width="4"/><circle cx="746" cy="151" r="11" fill="#451952" stroke="#F99417" stroke-width="4"/><circle cx="1033" cy="151" r="11" fill="#451952" stroke="#F99417" stroke-width="4"/><path d="M310 143l10 8-10 8" fill="none" stroke="#F5F5F5" stroke-width="3"/><path d="M597 143l10 8-10 8" fill="none" stroke="#F5F5F5" stroke-width="3"/><path d="M884 143l10 8-10 8" fill="none" stroke="#F5F5F5" stroke-width="3"/>
