<svg width="1200" height="260" viewBox="0 0 1200 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">The next model is already training</title>
  <desc id="desc">A retro animated closing card in the profile palette.</desc>
  <defs>
  <filter id="grain" x="-10%" y="-10%" width="120%" height="120%">
    <feTurbulence type="fractalNoise" baseFrequency=".75" numOctaves="2" seed="9" result="noise"/>
    <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
    <feComponentTransfer in="mono" result="fade"><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer>
    <feBlend in="SourceGraphic" in2="fade" mode="multiply"/>
  </filter><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#451952"/><stop offset=".6" stop-color="#662549"/><stop offset="1" stop-color="#AE445A"/></linearGradient></defs>
  <style>
    .sun { animation:pulse 5s ease-in-out infinite;transform-origin:600px 137px}.rays { animation:spin 22s linear infinite;transform-origin:600px 137px}
    @keyframes pulse { 50% { transform:scale(1.07) } } @keyframes spin { to { transform:rotate(360deg) } }
    @media (prefers-reduced-motion: reduce) { * { animation:none!important; } }
  </style>
  <rect width="1200" height="260" fill="url(#sky)"/>
  <g class="rays" opacity=".35" fill="none" stroke="#F5F5F5" stroke-width="4"><circle cx="600" cy="137" r="125" stroke-dasharray="2 10"/><circle cx="600" cy="137" r="160" stroke-dasharray="18 12"/><circle cx="600" cy="137" r="200" stroke-dasharray="2 10"/><circle cx="600" cy="137" r="245" stroke-dasharray="40 16"/></g>
  <circle class="sun" cx="600" cy="137" r="94" fill="#F99417"/>
  <path d="M0 205C168 160 329 238 502 198C714 148 919 235 1200 185V260H0Z" fill="#363062"/>
  <text x="600" y="117" text-anchor="middle" fill="#F5F5F5" stroke="#451952" stroke-width="3" paint-order="stroke" font-family="Impact, Haettenschweiler, sans-serif" font-size="53" letter-spacing="2">THE NEXT MODEL</text>
  <text x="600" y="169" text-anchor="middle" fill="#F5F5F5" stroke="#451952" stroke-width="3" paint-order="stroke" font-family="Impact, Haettenschweiler, sans-serif" font-size="53" letter-spacing="2">IS ALREADY TRAINING</text>
  <text x="600" y="226" text-anchor="middle" fill="#F5F5F5" font-family="Arial Black, Arial, sans-serif" font-size="12" font-weight="900" letter-spacing="5">DATA • MODELS • SYSTEMS BY AYUSH KUMAR MAURYA</text>
  <rect width="1200" height="260" fill="transparent" filter="url(#grain)" opacity=".2"/>
</svg>